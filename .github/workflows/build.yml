name: Build desktop apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Build and publish a new version
        type: boolean
        default: false
      bump:
        description: Version increment for a new release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.NATIVE_UPDATES != 'true'
    name: Select release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ github.event_name == 'release' || inputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUBLISH: ${{ inputs.publish }}
          BUMP: ${{ inputs.bump || 'patch' }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = release ]; then
            echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" = true ]; then
            python packaging/next_version.py --bump "$BUMP"
          else
            echo "version=dev-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  gitcode-check:
    name: Check GitCode configuration
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && vars.ENABLE_DIRECT_GITCODE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.5
      - run: python packaging/publish_gitcode.py --preflight
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO }}

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, gitcode-check]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.gitcode-check.result == 'success' || needs.gitcode-check.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            python_arch: x64
          - target: macos-arm64
            runner: macos-15
            python_arch: arm64
            mac_arch: arm64
          - target: macos-x86_64
            runner: macos-15-intel
            python_arch: x64
            mac_arch: x86_64
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
      PACKAGE_PROJECT: char-detection-main
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: packaging/requirements-*.txt
      - name: Validate package naming
        shell: bash
        run: python packaging/release_assets.py --project "$PACKAGE_PROJECT" --version "$PACKAGE_VERSION" --target "$PACKAGE_TARGET" --validate-only
      - name: Download default OCR models
        run: python packaging/download_models.py
      - name: Install and test (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --timeout 120 --retries 5 --only-binary=:all: -r packaging/requirements-windows.txt pytest requests==2.32.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/ -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure MSVC compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Build, smoke-test and archive (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --clean app.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/package_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and smoke-test native Mac app
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_TARGET: ${{ matrix.mac_arch }}
        run: |
          if [ "$MAC_TARGET" = arm64 ]; then
            export PYTHON_ARM64="$(command -v python)"
          else
            export PYTHON_X86_64="$(command -v python)"
          fi
          bash build_mac.sh "$MAC_TARGET"
      - name: Test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_TARGET: ${{ matrix.mac_arch }}
        run: |
          "build/mac-env-$MAC_TARGET/bin/python" -m pip install pytest requests==2.32.5
          "build/mac-env-$MAC_TARGET/bin/python" -m pytest tests/ -q
      - name: Stage versioned release assets
        shell: bash
        run: python packaging/release_assets.py --project "$PACKAGE_PROJECT" --version "$PACKAGE_VERSION" --target "$PACKAGE_TARGET"
      - name: Upload installable archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/release/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned installers
    if: ${{ !cancelled() && needs.prepare.outputs.publish == 'true' && needs.build.result == 'success' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 切字-${{ needs.prepare.outputs.version }}-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - name: Publish archives to this private repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != release ]; then
            if existing=$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish 2>/dev/null); then
              [ "$existing" = "$GITHUB_SHA" ] || { echo "Release tag already belongs to another build"; exit 1; }
            else
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "RELEASE_NOTES_${RELEASE_TAG}.md"
            fi
          fi
          gh release edit "$RELEASE_TAG" --notes-file "RELEASE_NOTES_${RELEASE_TAG}.md"
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber

  gitcode-release:
    name: Publish GitCode installers
    if: needs.prepare.outputs.publish == 'true' && vars.ENABLE_DIRECT_GITCODE == 'true'
    needs: [prepare, release, gitcode-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: 切字-${{ needs.prepare.outputs.version }}-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - run: python -m pip install requests==2.32.5
      - name: Read published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '{release:.}' > release-event.json
      - run: python packaging/publish_gitcode.py --event release-event.json
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gitcode-release-metadata
          path: gitcode-release.json

  public-release:
    name: Publish public installers
    concurrency:
      group: public-installers-${{ github.repository }}
      cancel-in-progress: false
    if: ${{ !cancelled() && needs.prepare.outputs.publish == 'true' && needs.release.result == 'success' }}
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: 切字-${{ needs.prepare.outputs.version }}-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - name: Publish to Normalight/hanzi-soft
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python packaging/publish_public.py --product char-detection-main --version "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT"
          gh release edit "char-detection-main-$RELEASE_TAG" --repo Normalight/hanzi-soft --notes-file "RELEASE_NOTES_${RELEASE_TAG}.md"
