name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            python_arch: x64
          - target: macos-intel
            runner: macos-15-intel
            python_arch: x64
            mac_arch: x86_64
          - target: macos-apple-silicon
            runner: macos-15
            python_arch: arm64
            mac_arch: arm64
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: packaging/requirements-*.txt
      - name: Download default OCR models
        run: python packaging/download_models.py
      - name: Install and test (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --timeout 120 --retries 5 --only-binary=:all: -r packaging/requirements-windows.txt pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/ -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, smoke-test and archive (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --clean app.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/package_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and smoke-test native Mac app
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_TARGET: ${{ matrix.mac_arch }}
        run: |
          PYTHON_ARM64="$(command -v python)" PYTHON_X86_64="$(command -v python)" bash build_mac.sh "$MAC_TARGET"
      - name: Test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_TARGET: ${{ matrix.mac_arch }}
        run: |
          "build/mac-env-$MAC_TARGET/bin/python" -m pip install pytest
          "build/mac-env-$MAC_TARGET/bin/python" -m pytest tests/ -q
      - name: Upload installable archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: char-detection-main-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish versioned installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: char-detection-main-*
          path: release-assets
          merge-multiple: true
      - name: Publish archives to this private repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256 --clobber
