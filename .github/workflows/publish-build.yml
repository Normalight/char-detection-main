name: Publish completed build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build desktop apps run ID
        required: true
        type: string
      version:
        description: Version embedded in the built packages
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: public-installers-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate completed source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > source-run.json
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          run = json.loads(Path('source-run.json').read_text())
          assert run['conclusion'] == 'success' and run['head_branch'] == 'main'
          assert run['path'] == '.github/workflows/build.yml'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('sha=' + run['head_sha'] + '\n')
          PYTHON
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: 切字-${{ inputs.version }}-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
      - name: Validate packages and publish private release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          existing=$(gh release view "$VERSION" --json targetCommitish --jq .targetCommitish)
          [ "$existing" = "$SOURCE_SHA" ] || { echo "Release belongs to a different source build"; exit 1; }
          gh release upload "$VERSION" release-assets/* --clobber
          gh release edit "$VERSION" --draft=false
      - name: Publish verified public installers
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python packaging/publish_public.py --product char-detection-main --version "$VERSION" --source-commit "$SOURCE_SHA"
