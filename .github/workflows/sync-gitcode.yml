name: Retry GitCode release sync
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.0.0
      build_run_id:
        description: Successful installer build run ID
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: gitcode-retry-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: 切字-${{ inputs.tag }}-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Read original release description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '{release:.}' > release-event.json
      - run: python -m pip install requests==2.32.5
      - run: python -u packaging/publish_gitcode.py --event release-event.json
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gitcode-release-metadata
          path: gitcode-release.json
