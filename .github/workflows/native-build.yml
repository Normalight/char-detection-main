name: Build native installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version with a committed Chinese release note
        type: string
        required: true
      publish:
        description: Sign installers and publish the release with update feeds
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-installers-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PACKAGE_VERSION: ${{ inputs.version }}
      PRODUCT: char-detection-main
      HANZI_MAC_SIGNING: adhoc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Configure public native update identity
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          version = os.environ['PACKAGE_VERSION']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', version)
          assert Path(f'RELEASE_NOTES_{version}.md').is_file()
          data = json.loads(Path('packaging/native_update_public.json').read_text())
          assert data['product'] == os.environ['PRODUCT']
          platform = 'windows' if os.environ['TARGET'] == 'windows-x64' else 'macos'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write('HANZI_UPDATE_FEED=' + data['feed_base'] + '/' + platform + '-appcast.xml\n')
              out.write('HANZI_UPDATE_PUBLIC_KEY=' + data['public_key'] + '\n')
              out.write('HANZI_UPDATE_CHANNEL=' + data['channel'] + '\n')
          PYTHON
      - name: Prepare official updater SDK
        run: python packaging/native_sdk.py --target ${{ matrix.target }}
      - name: Download models
        run: python packaging/download_models.py
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: -r packaging/requirements-windows.txt pytest requests==2.32.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Build Windows installer and verify installed image
        if: runner.os == 'Windows'
        run: |
          python -m pytest tests/ -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean app.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/native_release.py windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-Item "dist/${env:PRODUCT}-${env:PACKAGE_VERSION}-windows-x64.exe"
          $install = Join-Path $env:RUNNER_TEMP 'native-install-test'
          $process = Start-Process $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/SP-', '/NORESTART', '/HANZITEST=1', ('/DIR="' + $install + '"') -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $exe = Join-Path $install 'interactive_annotator.exe'
          python -c "import subprocess,sys; subprocess.run([sys.argv[1], '--smoke-test'], check=True, timeout=120)" $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign installer and generate Windows feed
        if: runner.os == 'Windows' && inputs.publish == true
        shell: bash
        env:
          HANZI_UPDATE_PRIVATE_KEY: ${{ secrets.HANZI_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$HANZI_UPDATE_PRIVATE_KEY" ]; then echo '缺少 HANZI_UPDATE_PRIVATE_KEY secret' >&2; exit 1; fi
          key="$(mktemp)"
          printf '%s\n' "$HANZI_UPDATE_PRIVATE_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          base="$(python - <<'PY'
          import json
          print(json.loads(open('packaging/native_update_public.json', encoding='utf-8').read())['feed_base'].rsplit('/', 1)[0])
          PY
          )"
          exe="dist/$PRODUCT-$PACKAGE_VERSION-windows-x64.exe"
          [ -f "$exe" ] || { echo "缺少 Windows 安装器：$exe" >&2; exit 1; }
          sdk="$(dirname "$(dirname "$(dirname "$WINSPARKLE_DLL")")")"
          "$sdk/bin/winsparkle-tool.exe" sign -f "$key" "$exe" > dist/update-signature.txt
          python packaging/native_appcast.py windows "$exe" \
            --product "$PRODUCT" --version "$PACKAGE_VERSION" \
            --url "$base/$PRODUCT-$PACKAGE_VERSION/$(basename "$exe")" \
            --signature-file dist/update-signature.txt \
            --notes "RELEASE_NOTES_$PACKAGE_VERSION.md" \
            --output dist/windows-appcast.xml
      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PYTHON_ARM64="$(command -v python)" bash build_mac.sh arm64
          build/mac-env-arm64/bin/python -m pip install pytest requests==2.32.5
          build/mac-env-arm64/bin/python -m pytest tests/ -q
      - name: Generate signed macOS feed
        if: runner.os == 'macOS' && inputs.publish == true
        shell: bash
        env:
          HANZI_UPDATE_PRIVATE_KEY: ${{ secrets.HANZI_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$HANZI_UPDATE_PRIVATE_KEY" ]; then echo '缺少 HANZI_UPDATE_PRIVATE_KEY secret' >&2; exit 1; fi
          key="$(mktemp)"
          printf '%s\n' "$HANZI_UPDATE_PRIVATE_KEY" > "$key"
          archives="$(mktemp -d)"
          trap 'rm -f "$key"; rm -rf "$archives"' EXIT
          base="$(python - <<'PY'
          import json
          print(json.loads(open('packaging/native_update_public.json', encoding='utf-8').read())['feed_base'].rsplit('/', 1)[0])
          PY
          )"
          zip="dist/$PRODUCT-$PACKAGE_VERSION-macos-arm64.zip"
          [ -f "$zip" ] || { echo "缺少 macOS 更新包：$zip" >&2; exit 1; }
          cp "$zip" "$archives/"
          cp "RELEASE_NOTES_$PACKAGE_VERSION.md" "$archives/$(basename "${zip%.zip}").md"
          sdk="$(dirname "$SPARKLE_FRAMEWORK")"
          build/mac-env-arm64/bin/python packaging/native_appcast.py macos "$archives" \
            --tool "$sdk/bin/generate_appcast" \
            --ed-key-file "$key" \
            --download-url-prefix "$base/$PRODUCT-$PACKAGE_VERSION/" \
            --public-key "$HANZI_UPDATE_PUBLIC_KEY"
          cp "$archives/appcast.xml" dist/macos-appcast.xml
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.target }}-${{ inputs.version }}
          path: |
            dist/*-windows-x64.exe
            dist/char-detection-main-${{ inputs.version }}-macos-arm64.zip
            dist/*-appcast.xml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish version and update feeds
    if: inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
      PRODUCT: char-detection-main
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: "python -m pip install --only-binary=:all: 'pynacl>=1.6.2,<2'"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-*-${{ inputs.version }}
          path: assets
          merge-multiple: true
      - name: Publish signed release and stable feeds
        run: |
          python packaging/native_publish.py --product "$PRODUCT" --version "$PACKAGE_VERSION" \
            --assets assets --notes "RELEASE_NOTES_$PACKAGE_VERSION.md" --source-commit "$GITHUB_SHA"
