name: Build native installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version with a committed Chinese release note
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-installers-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PACKAGE_VERSION: ${{ inputs.version }}
      HANZI_MAC_SIGNING: adhoc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Configure public native update identity
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          version = os.environ['PACKAGE_VERSION']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', version)
          assert Path(f'RELEASE_NOTES_{version}.md').is_file()
          data = json.loads(Path('packaging/native_update_public.json').read_text())
          platform = 'windows' if os.environ['TARGET'] == 'windows-x64' else 'macos'
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write('HANZI_UPDATE_FEED=' + data['feed_base'] + '/' + platform + '-appcast.xml\n')
              out.write('HANZI_UPDATE_PUBLIC_KEY=' + data['public_key'] + '\n')
              out.write('HANZI_UPDATE_CHANNEL=' + data['channel'] + '\n')
          PYTHON
      - name: Prepare official updater SDK
        run: python packaging/native_sdk.py --target ${{ matrix.target }}
      - name: Download models
        run: python packaging/download_models.py
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: -r packaging/requirements-windows.txt pytest requests==2.32.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Build Windows installer and verify installed image
        if: runner.os == 'Windows'
        run: |
          python -m pytest tests/ -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean app.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/native_release.py windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          $install = Join-Path $env:RUNNER_TEMP 'native-install-test'
          $process = Start-Process $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/SP-', '/NORESTART', '/HANZITEST=1', ('/DIR="' + $install + '"') -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $exe = Join-Path $install 'interactive_annotator.exe'
          python -c "import subprocess,sys; subprocess.run([sys.argv[1], '--smoke-test'], check=True, timeout=120)" $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          PYTHON_ARM64="$(command -v python)" bash build_mac.sh arm64
          build/mac-env-arm64/bin/python -m pip install pytest requests==2.32.5
          build/mac-env-arm64/bin/python -m pytest tests/ -q
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.target }}-${{ inputs.version }}
          path: |
            dist/*-windows-x64-setup.exe
            dist/char-detection-main-${{ inputs.version }}-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
